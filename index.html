<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="app-theme-color" name="theme-color" content="#f1ede5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Metrocron" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Temporizador y metrónomo para sesiones de práctica musical."
    />
    <script>
      (() => {
        const saved = localStorage.getItem('metrocron-theme')
        const preference = ['light', 'dark', 'system'].includes(saved) ? saved : 'system'
        const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        const theme = preference === 'system' ? systemTheme : preference
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('#app-theme-color').content = theme === 'dark' ? '#161817' : '#f1ede5'
      })()
    </script>
    <title>Metrocron — Tu tiempo, a tempo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
