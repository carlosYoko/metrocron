<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe6" />
    <meta
      name="description"
      content="Temporizador y metrónomo para sesiones de práctica musical."
    />
    <script>
      (() => {
        const saved = localStorage.getItem('metrocron-theme')
        const preference = ['light', 'dark', 'system'].includes(saved) ? saved : 'system'
        const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        const theme = preference === 'system' ? systemTheme : preference
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <title>Metrocron — Tu tiempo, a tempo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
